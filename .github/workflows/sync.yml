name: Sync Full Moe App Library

on:
  workflow_dispatch:

  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: moe-full-source-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04

    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "curl_cffi>=0.7,<1" "beautifulsoup4>=4.12,<5"

      - name: Sync full Moe catalog
        run: |
          python sync.py

      - name: Commit updated source
        run: |
          if [ -z "$(git status --porcelain -- apps.json)" ]; then
            echo "apps.json is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add apps.json
          git commit -m "Update full Moe app catalog"
          git push
